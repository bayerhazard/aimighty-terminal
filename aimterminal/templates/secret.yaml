---
apiVersion: v1
kind: Secret
metadata:
  name: aimterminal-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep the key when the release is removed: a later reinstall must stay
    # wired to the same Open WebUI terminal connection.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OPEN_TERMINAL_API_KEY: {{ .Values.olaresEnv.OPEN_TERMINAL_API_KEY | quote }}
